#!/bin/bash

# Use BASH_SOURCE[0] to reliably get the directory where this script is located.
# This is more robust than `dirname "$0"` or using environment variables.
DIR_NAME=$(dirname "${BASH_SOURCE[0]}")

# Set execute permissions on the other scripts using the discovered path.
chmod +x "$DIR_NAME/h-run.sh"
chmod +x "$DIR_NAME/h-stats.sh"
chmod +x "$DIR_NAME/h-config.sh"

# Define miner variables for HiveOS.
CUSTOM_NAME="ComfyUISheet"
CUSTOM_LOG_BASENAME="/home/octa/UltimatComfy/debugFlight"
