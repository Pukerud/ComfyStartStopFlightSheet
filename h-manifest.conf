#!/bin/bash

# The CUSTOM_MINER variable is set by HiveOS and holds the package name (e.g., "v4ComfyUISheet").
# We use it to build a reliable, absolute path to the miner's files.
MINER_DIR="/hive/miners/custom/$CUSTOM_MINER"

# Set execute permissions on the other scripts using the correct, absolute path.
chmod +x "$MINER_DIR/h-run.sh"
chmod +x "$MINER_DIR/h-stats.sh"
chmod +x "$MINER_DIR/h-config.sh"

# Define miner variables for HiveOS.
# The CUSTOM_NAME is used for display purposes in the HiveOS interface.
CUSTOM_NAME="ComfyUISheet"
CUSTOM_LOG_BASENAME="/home/octa/UltimatComfy/debugFlight"
